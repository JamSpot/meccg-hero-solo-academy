<header class="site-header" role="banner">
  <style>
    .site-header .wrapper {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding-top: 12px;
      padding-bottom: 12px;
    }
    .site-header .site-title {
      display: block;
      max-width: 100%;
      font-weight: 700;
      line-height: 1.25;
      margin: 0;
    }
    .site-header .academy-nav {
      display: flex !important;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 8px;
      width: 100%;
      margin: 0;
      padding: 10px 0 0;
      border-top: 1px solid #d7dce2;
    }
    .site-header .academy-nav a {
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      box-sizing: border-box;
      padding: 7px 12px;
      border: 1px solid #c7ced6;
      border-radius: 6px;
      background: #f5f7f9;
      color: #17212b !important;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      text-decoration: none;
      white-space: normal;
    }
    .site-header .academy-nav a:hover,
    .site-header .academy-nav a:focus {
      background: #e5edf5;
      text-decoration: underline;
      outline-offset: 2px;
    }
    .course-steps li {
      margin: 0 0 1rem;
      padding-left: .25rem;
    }
    .next-lesson {
      margin: 1.5rem 0;
      padding: 1rem 1.2rem;
      border: 2px solid #687b8c;
      border-radius: 8px;
      background: #f5f7f9;
      color: #17212b;
    }
    .next-lesson p:last-child { margin-bottom: 0; }
    @media (max-width: 600px) {
      .site-header .academy-nav a {
        flex: 1 1 40%;
        text-align: center;
      }
    }
  </style>
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="academy-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}">Course Home</a>
      <a href="{{ '/academy/' | relative_url }}">1. Start Here</a>
      <a href="{{ '/academy/learning-path/' | relative_url }}">Course Path</a>
      <a href="{{ '/games/game-1/' | relative_url }}">2. Play Game 1</a>
      <a href="{{ '/decks/hero-deck/' | relative_url }}">Decks</a>
      <a href="{{ '/scenarios/' | relative_url }}">Practice</a>
      <a href="{{ '/navigation/' | relative_url }}">All Pages / Reference</a>
    </nav>
  </div>
</header>
