<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    <a class="skip-to-content" href="#main-content">Skip to main content</a>
    {% include header.html %}
    <main id="main-content" class="page-content" aria-label="Content">
      {{ content }}
    </main>
    {% include footer.html %}
    <style>
      .skip-to-content {
        position: absolute;
        left: -9999px;
        top: 0;
        z-index: 1000;
        padding: 8px 12px;
        background: #ffffff;
        color: #17212b;
        border: 2px solid #17212b;
      }
      .skip-to-content:focus {
        left: 12px;
        top: 12px;
      }
    </style>
  </body>
</html>
