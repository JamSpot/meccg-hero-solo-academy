title: MECCG Hero Solo Academy
description: A practical solo-learning system for Hero play in Middle-earth CCG
theme: minima
baseurl: /meccg-hero-solo-academy
url: https://jamspot.github.io
markdown: kramdown
plugins:
  - jekyll-feed
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - drafts/
  - guide/test.md
