name: Build and deploy Academy website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Share GitHub Pages' deployment group so the correct site/ artifact wins over the legacy branch build.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Jekyll and site dependencies
        run: |
          gem install jekyll -v 3.10.0 --no-document
          gem install minima -v 2.5.1 --no-document
          gem install jekyll-feed -v 0.17.0 --no-document
          gem install kramdown-parser-gfm --no-document
          gem list --local '^kramdown-parser-gfm$'

      - name: Build the actual website from site/
        run: jekyll build --source site --destination _site

      - name: Verify homepage, navigation, and core learning pages
        run: |
          test -f _site/index.html
          test -f _site/navigation/index.html
          test -f _site/academy/index.html
          test -f _site/academy/learning-path/index.html
          test -f _site/games/index.html
          test -f _site/games/game-1/index.html
          test -f _site/decks/index.html
          test -f _site/decks/hero-deck/index.html
          test -f _site/decks/hazard-deck/index.html
          test -f _site/decks/hazard-combos/index.html
          test -f _site/reference/index.html
          test -f _site/reference/free-movement/index.html
          test -f _site/reference/solo-ruleset/index.html
          test -f _site/routes/index.html
          test -f _site/routes/expedition-planner/index.html
          test -f _site/scenarios/index.html
          test -f _site/scenarios/hazard-combo-lab/index.html
          test -f _site/scenarios/expedition-decision-lab/index.html
          test -f _site/scenarios/expedition-decision-lab/answer-key/index.html
          test ! -f _site/academy/learning-path.html
          test ! -e _site/drafts
          test ! -f _site/guide/test.html
          grep -q 'academy-nav' _site/index.html
          grep -q 'academy-nav' _site/navigation/index.html
          grep -q 'href="/meccg-hero-solo-academy/navigation/"' _site/index.html
          grep -q 'href="/meccg-hero-solo-academy/academy/learning-path/"' _site/index.html
          ! grep -R -q 'academy/learning-path.html' site

      - name: Audit generated internal page links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote

          root = Path("_site")
          base = "/meccg-hero-solo-academy"

          class AnchorParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          problems = []
          for page in root.rglob("*.html"):
              parser = AnchorParser()
              parser.feed(page.read_text(encoding="utf-8"))
              rel_page = "/" + page.relative_to(root).as_posix()
              for href in parser.links:
                  parsed = urlsplit(href)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  if parsed.path.startswith("/"):
                      path = unquote(parsed.path)
                      if path == base:
                          path = "/"
                      elif path.startswith(base + "/"):
                          path = path[len(base):]
                      else:
                          problems.append(f"{page.relative_to(root)}: root link missing baseurl: {href}")
                          continue
                  else:
                      resolved = urlsplit(urljoin(rel_page, href))
                      path = unquote(resolved.path)

                  candidate = root / path.lstrip("/")
                  if path.endswith("/"):
                      candidate = candidate / "index.html"
                  elif not candidate.exists():
                      if (candidate / "index.html").exists():
                          candidate = candidate / "index.html"
                      elif candidate.suffix == "":
                          candidate = candidate.with_suffix(".html")

                  if not candidate.exists():
                      problems.append(f"{page.relative_to(root)}: broken internal link {href} -> {candidate}")

          if problems:
              print("\n".join(problems))
              raise SystemExit(f"Found {len(problems)} broken internal link(s).")
          print("Generated internal links resolve to existing pages.")
          PY

      - name: Upload built site for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
