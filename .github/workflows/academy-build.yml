name: Build Academy website

on:
  push:
    branches:
      - main
      - guide-expansion-2026-10-18
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install Jekyll and site theme
        run: |
          gem install jekyll -v 3.10.0 --no-document
          gem install minima -v 2.5.1 --no-document
          gem install jekyll-feed -v 0.17.0 --no-document
          gem install kramdown-parser-gfm --no-document
          gem list --local '^kramdown-parser-gfm$'

      - name: Build site from the Pages source folder
        run: jekyll build --source site --destination /tmp/academy-site

      - name: Check key pages and shared navigation
        run: |
          test -f /tmp/academy-site/index.html
          test -f /tmp/academy-site/navigation/index.html
          test -f /tmp/academy-site/academy/learning-path/index.html
          test -f /tmp/academy-site/decks/hero-deck/index.html
          test -f /tmp/academy-site/decks/hazard-deck/index.html
          test -f /tmp/academy-site/decks/hazard-combos/index.html
          test -f /tmp/academy-site/reference/free-movement/index.html
          test -f /tmp/academy-site/routes/expedition-planner/index.html
          test -f /tmp/academy-site/scenarios/hazard-combo-lab/index.html
          test -f /tmp/academy-site/scenarios/expedition-decision-lab/index.html
          test -f /tmp/academy-site/scenarios/expedition-decision-lab/answer-key/index.html
          grep -q 'academy-nav' /tmp/academy-site/index.html
          grep -q 'academy-nav' /tmp/academy-site/navigation/index.html
          grep -q '/meccg-hero-solo-academy/navigation/' /tmp/academy-site/index.html
          grep -q '/meccg-hero-solo-academy/academy/learning-path/' /tmp/academy-site/index.html
          ! grep -R -q 'academy/learning-path.html' site

      - name: Audit internal page links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote

          root = Path("/tmp/academy-site")
          base = "/meccg-hero-solo-academy"

          class AnchorParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href")
                      if href:
                          self.links.append(href)

          problems = []
          for page in root.rglob("*.html"):
              parser = AnchorParser()
              parser.feed(page.read_text(encoding="utf-8"))
              rel_page = "/" + page.relative_to(root).as_posix()
              for href in parser.links:
                  parsed = urlsplit(href)
                  if parsed.scheme or parsed.netloc or not parsed.path:
                      continue
                  if parsed.path.startswith("/"):
                      path = unquote(parsed.path)
                      if path == base:
                          path = "/"
                      elif path.startswith(base + "/"):
                          path = path[len(base):]
                      else:
                          problems.append(f"{page.relative_to(root)}: root link missing baseurl: {href}")
                          continue
                  else:
                      resolved = urlsplit(urljoin(rel_page, href))
                      path = unquote(resolved.path)

                  candidate = root / path.lstrip("/")
                  if path.endswith("/"):
                      candidate = candidate / "index.html"
                  elif not candidate.exists():
                      if (candidate / "index.html").exists():
                          candidate = candidate / "index.html"
                      elif candidate.suffix == "":
                          candidate = candidate.with_suffix(".html")

                  if not candidate.exists():
                      problems.append(f"{page.relative_to(root)}: broken internal link {href} -> {candidate.relative_to(root) if candidate.is_relative_to(root) else candidate}")

          if problems:
              print("\n".join(problems))
              raise SystemExit(f"Found {len(problems)} broken internal link(s).")
          print("Internal anchor links resolve to generated pages.")
          PY
